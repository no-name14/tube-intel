<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><!-- v5 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TUBE INTEL PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:#070709;color:#eeeef5;font-family:'Noto Sans JP',system-ui,sans-serif;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px}
::-webkit-scrollbar{width:0}
input,button{font-family:inherit;outline:none}
a{color:#7c6dfa}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
.fade{animation:fadeUp 0.25s ease both}
.spin{animation:spin 0.9s linear infinite;display:inline-block}
.pulse{animation:pulse 1.5s ease infinite}
.screen{display:none}.screen.active{display:block}
.mono{font-family:'IBM Plex Mono',monospace}
.disp{font-family:'Syne',sans-serif}

/* Setup */
#setup{padding:32px 20px;min-height:100vh}
.logo-sub{font-size:11px;letter-spacing:3px;color:#7c6dfa;margin-bottom:8px}
.logo{font-size:42px;line-height:1;background:linear-gradient(135deg,#7c6dfa,#5bb8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-desc{font-size:12px;color:#4a4a60;margin-top:10px;margin-bottom:36px}
.field-label{font-size:10px;color:#4a4a60;letter-spacing:2px;font-family:'IBM Plex Mono',monospace;margin-bottom:7px}
.field-wrap{margin-bottom:14px}
.field-input{width:100%;background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:14px 16px;color:#eeeef5;font-size:14px;font-family:'IBM Plex Mono',monospace}
.field-input:focus{border-color:#7c6dfa}
#channel-input{font-family:'Noto Sans JP',system-ui,sans-serif}
.start-btn{width:100%;padding:17px;margin-top:8px;background:linear-gradient(135deg,#7c6dfa,#5bb8ff);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;font-family:'Syne',sans-serif}
.start-btn:disabled{background:#1e1e28;color:#4a4a60;cursor:default}
.info-box{margin-top:20px;padding:16px;background:#0e0e12;border-radius:10px;font-size:12px;color:#4a4a60;line-height:1.8;border:1px solid #1e1e28}
.err-box{background:#ff4d6d18;border:1px solid #ff4d6d44;border-radius:10px;padding:14px;margin-bottom:20px;font-size:13px;color:#ff4d6d;line-height:1.6;display:none}

/* Loading */
#loading{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center}
#loading.active{display:flex}
#load-msg{margin-top:16px;font-size:13px;color:#4a4a60;font-family:'IBM Plex Mono',monospace}

/* Header */
#header{position:sticky;top:0;z-index:20;background:rgba(7,7,9,0.94);backdrop-filter:blur(12px);border-bottom:1px solid #1e1e28;padding:11px 16px;display:none;align-items:center;gap:11px}
#header.active{display:flex}
#ch-thumb{width:36px;height:36px;border-radius:50%;border:2px solid #7c6dfa;flex-shrink:0}
#ch-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ch-sub{font-size:10px;color:#4a4a60;font-family:'IBM Plex Mono',monospace}
.badge-pro{background:#22d98a22;color:#22d98a;border-radius:4px;padding:2px 7px;font-size:10px;font-family:'IBM Plex Mono',monospace;margin-left:auto}
#settings-btn{background:none;border:1px solid #1e1e28;color:#4a4a60;border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;flex-shrink:0}

/* Tabs */
#tabbar{display:none;border-bottom:1px solid #1e1e28;position:sticky;top:59px;z-index:19;background:rgba(7,7,9,0.94);backdrop-filter:blur(12px)}
#tabbar.active{display:flex}
.tab-btn{flex:1;padding:13px 0;background:none;border:none;border-bottom:2px solid transparent;color:#4a4a60;font-size:12px;cursor:pointer;font-weight:400;transition:all 0.2s}
.tab-btn.active{color:#7c6dfa;border-bottom-color:#7c6dfa;font-weight:700}

/* Period bar */
#period-bar{display:none;padding:10px 16px;gap:8px;border-bottom:1px solid #1e1e28;overflow-x:auto}
#period-bar.active{display:flex}
.period-btn{padding:5px 14px;border-radius:20px;border:1px solid #1e1e28;background:none;color:#4a4a60;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.2s}
.period-btn.active{border-color:#7c6dfa;background:rgba(124,109,250,0.12);color:#7c6dfa}

/* Content */
.tab-content{display:none;padding:16px}.tab-content.active{display:block}

/* Cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metric-card{background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:14px 16px}
.metric-mono{font-size:10px;color:#4a4a60;letter-spacing:2px;font-family:'IBM Plex Mono',monospace;margin-bottom:6px}
.metric-val{font-size:26px;font-family:'Syne',sans-serif;letter-spacing:-0.5px;line-height:1}
.metric-label{font-size:11px;color:#4a4a60;margin-top:4px}

/* Progress bar */
.prog-wrap{height:3px;background:#1e1e28;border-radius:2px;overflow:hidden;margin-top:12px}
.prog-bar{height:100%;border-radius:2px;transition:width 0.5s ease}

/* Section card */
.section-card{background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:16px;margin-bottom:10px}
.section-title{font-size:12px;font-weight:700;margin-bottom:8px;color:#7c6dfa}
.section-body{font-size:13px;color:#aaa;line-height:1.85}

/* Video list */
.video-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #1e1e28;cursor:pointer}
.video-thumb-wrap{position:relative;flex-shrink:0}
.video-thumb{width:118px;height:66px;object-fit:cover;border-radius:6px}
.video-dur{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,0.85);border-radius:2px;padding:1px 4px;font-size:10px;font-family:'IBM Plex Mono',monospace}
.video-title{font-size:13px;line-height:1.4;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.video-stats{font-size:11px;color:#4a4a60;font-family:'IBM Plex Mono',monospace}

/* Sort bar */
.sort-bar{display:flex;padding:10px 16px;gap:8px;border-bottom:1px solid #1e1e28;overflow-x:auto}
.sort-btn{padding:6px 14px;border-radius:20px;border:1px solid #1e1e28;background:none;color:#4a4a60;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.sort-btn.active{border-color:#7c6dfa;background:rgba(124,109,250,0.12);color:#7c6dfa}

/* AI */
.ai-start{text-align:center;padding-top:60px}
.ai-icon{font-size:64px;margin-bottom:20px}
.ai-title{font-family:'Syne',sans-serif;font-size:24px;margin-bottom:10px}
.ai-desc{font-size:13px;color:#555;line-height:1.9;margin-bottom:40px}
.ai-btn{padding:17px 48px;background:linear-gradient(135deg,#7c6dfa,#5bb8ff);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:1px}
.score-big{font-size:72px;font-family:'Syne',sans-serif;line-height:1;letter-spacing:-2px}
.score-label{font-size:10px;color:#4a4a60;font-family:'IBM Plex Mono',monospace;letter-spacing:2px;margin-top:2px}
.rec-item{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.rec-num{background:linear-gradient(135deg,#7c6dfa,#5bb8ff);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-family:'IBM Plex Mono',monospace}
.rec-text{font-size:13px;color:#bbb;line-height:1.7}
.grid-risks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.risk-card{background:#0e0e12;border-radius:10px;padding:14px}
.risk-title{font-size:11px;font-weight:700;margin-bottom:10px;letter-spacing:1px}
.risk-item{font-size:12px;color:#666;margin-bottom:7px;line-height:1.5}

/* Modal */
#modal{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:100dvh;background:#070709;z-index:50;overflow-y:auto;display:none}
#modal.active{display:block}
#modal-header{position:sticky;top:0;background:rgba(7,7,9,0.94);backdrop-filter:blur(12px);border-bottom:1px solid #1e1e28;padding:13px 16px;display:flex;align-items:center;gap:12px;z-index:60}
#modal-back{background:none;border:none;color:#eeeef5;font-size:22px;cursor:pointer;padding:0;line-height:1}
#modal-banner{width:100%;height:200px;object-fit:cover;display:block}
#modal-body{padding:16px}
.modal-title{font-size:15px;font-weight:700;line-height:1.5;margin-bottom:6px}
.modal-meta{font-size:11px;color:#4a4a60;margin-bottom:16px;font-family:'IBM Plex Mono',monospace}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat3-card{background:#0e0e12;border:1px solid #1e1e28;border-radius:8px;padding:12px 8px;text-align:center}
.stat3-icon{font-size:16px}
.stat3-val{font-size:14px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-top:4px}
.stat3-label{font-size:10px;color:#4a4a60;margin-top:2px}
.analytics-card{background:#0e0e12;border:1px solid rgba(124,109,250,0.3);border-radius:10px;padding:14px;margin-bottom:14px}
.analytics-label{font-size:10px;color:#7c6dfa;font-family:'IBM Plex Mono',monospace;letter-spacing:2px;margin-bottom:12px}
.analytics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.analytics-item{background:#15151b;border-radius:8px;padding:10px 12px}
.analytics-item-label{font-size:10px;color:#4a4a60;margin-bottom:4px}
.analytics-item-val{font-size:16px;font-family:'Syne',sans-serif}
.score-row{display:flex;align-items:center;gap:20px;background:#0e0e12;border:1px solid #1e1e28;border-radius:12px;padding:18px;margin-bottom:12px}
.verdict{font-size:15px;font-weight:700;line-height:1.4;flex:1}
.strengths-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.strengths-card{background:#0e0e12;border-radius:10px;padding:14px}
.strengths-title{font-size:11px;font-weight:700;margin-bottom:10px}
.strengths-item{font-size:12px;color:#666;margin-bottom:6px;line-height:1.5}
.improvements{background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:16px;margin-bottom:24px}
.improvements-title{font-size:12px;font-weight:700;margin-bottom:12px}

/* Revenue */
.revenue-card{background:#0e0e12;border:1px solid rgba(245,200,66,0.3);border-radius:10px;padding:16px;margin-bottom:10px}
.revenue-label{font-size:10px;color:#f5c842;font-family:'IBM Plex Mono',monospace;letter-spacing:2px;margin-bottom:14px}
.revenue-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.revenue-val{font-size:18px;font-family:'Syne',sans-serif;color:#f5c842}
.revenue-sub{font-size:10px;color:#4a4a60;margin-top:2px}

/* Engagement */
.engage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.engage-item{background:#15151b;border-radius:8px;padding:12px 6px;text-align:center}
.engage-icon{font-size:18px}
.engage-val{font-size:18px;font-family:'Syne',sans-serif;margin-top:4px}
.engage-label{font-size:10px;color:#4a4a60;margin-top:2px}

/* Subs */
.subs-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}
.subs-val{font-size:24px;font-family:'Syne',sans-serif}
.subs-label{font-size:10px;color:#4a4a60;margin-top:2px}
/* Chat */
#chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-msg{max-width:85%;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.7}
.chat-msg.user{align-self:flex-end;background:#7c6dfa;color:#fff;border-bottom-right-radius:4px}
.chat-msg.ai{align-self:flex-start;background:#0e0e12;color:#ddd;border:1px solid #1e1e28;border-bottom-left-radius:4px}
.chat-msg.ai .chat-label{font-size:10px;color:#4a4a60;font-family:IBM Plex Mono,monospace;margin-bottom:4px;letter-spacing:1px}
.chat-input-wrap{padding:12px 16px;border-top:1px solid #1e1e28;display:flex;gap:10px;background:#070709}
.chat-input{flex:1;background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:12px 14px;color:#eeeef5;font-size:14px;resize:none;height:44px;max-height:120px;overflow-y:auto}
.chat-input:focus{border-color:#7c6dfa;outline:none}
.chat-send{background:linear-gradient(135deg,#7c6dfa,#5bb8ff);color:#fff;border:none;border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chat-thinking{align-self:flex-start;color:#4a4a60;font-size:12px;font-family:IBM Plex Mono,monospace;padding:8px 0}
/* Studio */
#tab-studio{display:none}
#tab-studio.active{display:flex}
#studio-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.studio-msg{max-width:88%;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.7}
.studio-msg.user{align-self:flex-end;background:#7c6dfa;color:#fff;border-bottom-right-radius:4px}
.studio-msg.ai{align-self:flex-start;background:#0e0e12;color:#ddd;border:1px solid #1e1e28;border-bottom-left-radius:4px}
.studio-msg img{max-width:100%;border-radius:8px;margin-top:8px;display:block}
.studio-input-area{border-top:1px solid #1e1e28;background:#070709;padding:10px 12px}
.studio-preview{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.studio-preview-item{position:relative;width:60px;height:60px}
.studio-preview-item img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid #1e1e28}
.studio-preview-item button{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#ff4d6d;border:none;border-radius:50%;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.studio-row{display:flex;gap:8px;align-items:flex-end}
.studio-textarea{flex:1;background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:11px 13px;color:#eeeef5;font-size:13px;resize:none;min-height:44px;max-height:120px;outline:none;font-family:inherit;line-height:1.5;word-break:break-all}
.studio-textarea:focus{border-color:#7c6dfa}
.studio-attach{width:42px;height:42px;background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;color:#4a4a60;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.studio-send{width:42px;height:42px;background:linear-gradient(135deg,#7c6dfa,#5bb8ff);border:none;border-radius:10px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Inline Chat */
.inline-chat{border-top:1px solid #1e1e28;margin-top:16px;padding-top:16px}
.inline-chat-title{font-size:11px;font-weight:700;color:#7c6dfa;letter-spacing:1px;margin-bottom:12px;font-family:IBM Plex Mono,monospace}
.inline-chat-messages{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:400px;overflow-y:auto}
.ichat-msg{max-width:88%;padding:10px 13px;border-radius:10px;font-size:13px;line-height:1.7}
.ichat-msg.user{align-self:flex-end;background:#7c6dfa;color:#fff;border-bottom-right-radius:3px}
.ichat-msg.ai{align-self:flex-start;background:#15151b;color:#ccc;border:1px solid #1e1e28;border-bottom-left-radius:3px}
.ichat-msg.thinking{align-self:flex-start;color:#4a4a60;font-size:12px;font-family:IBM Plex Mono,monospace;padding:6px 0;background:none;border:none}
.ichat-input-row{display:flex;gap:8px}
.ichat-input{flex:1;background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:11px 13px;color:#eeeef5;font-size:13px;outline:none;word-break:break-all;white-space:pre-wrap;resize:none;font-family:inherit;line-height:1.5}
.ichat-input:focus{border-color:#7c6dfa}
.ichat-send{background:linear-gradient(135deg,#7c6dfa,#5bb8ff);color:#fff;border:none;border-radius:10px;width:42px;height:42px;font-size:16px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="screen active">
  <div class="logo-sub mono">TUBE INTEL PRO</div>
  <div class="logo disp">YouTube<br>Analytics</div>
  <div class="logo-desc">CTR・視聴維持率・収益データ対応 フル分析ダッシュボード</div>
  <div class="err-box" id="err-box"></div>
  <div class="field-wrap">
    <div class="field-label">YOUTUBE DATA API KEY</div>
    <input type="password" class="field-input mono" id="f-apiKey" placeholder="AIzaSy...">
  </div>
  <div class="field-wrap">
    <div class="field-label">OAUTH CLIENT ID</div>
    <input type="text" class="field-input mono" id="f-clientId" placeholder="556266...apps.googleusercontent.com">
  </div>
  <div class="field-wrap">
    <div class="field-label">CLIENT SECRET</div>
    <input type="password" class="field-input mono" id="f-clientSecret" placeholder="GOCSPX-...">
  </div>
  <div class="field-wrap">
    <div class="field-label">REFRESH TOKEN</div>
    <input type="password" class="field-input mono" id="f-refreshToken" placeholder="1//04...">
  </div>
  <div class="field-wrap">
    <div class="field-label">CHANNEL HANDLE / URL</div>
    <input type="text" class="field-input" id="f-channel" placeholder="@yourchannel">
  </div>
  <button class="start-btn disp" id="start-btn" onclick="startLoad()">分析を開始する →</button>
  <div class="info-box">
    <span class="mono" style="color:#22d98a;font-size:10px">✦ 完全自動ログイン対応</span><br>
    初回だけ入力すれば次回から<strong style="color:#22d98a">自動でログイン</strong>されます。
  </div>
  <button onclick="logout()" style="width:100%;margin-top:12px;padding:12px;background:none;border:1px solid #1e1e28;color:#4a4a60;border-radius:10px;font-size:12px;cursor:pointer">ログアウト</button>
</div>



<!-- LOADING -->
<div id="loading">
  <div class="pulse disp" style="font-size:48px;background:linear-gradient(135deg,#7c6dfa,#5bb8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px">LOADING</div>
  <div id="load-msg" class="mono">準備中...</div>
</div>

<!-- HEADER -->
<div id="header">
  <img id="ch-thumb" src="" alt="">
  <div style="flex:1;min-width:0">
    <div id="ch-name"></div>
    <div id="ch-sub" class="mono"></div>
  </div>
  <span class="badge-pro mono">PRO</span>
  <button id="settings-btn" onclick="goSetup()">設定</button>

</div>

<!-- TABBAR -->
<div id="tabbar">
  <button class="tab-btn active" onclick="switchTab('overview',this)">概要</button>
  <button class="tab-btn" onclick="switchTab('analytics',this)">指標</button>
  <button class="tab-btn" onclick="switchTab('videos',this)">動画</button>
  <button class="tab-btn" onclick="switchTab('ai',this)">AI分析</button>
  <button class="tab-btn" onclick="switchTab('comments',this)">💬</button>
  <button class="tab-btn" onclick="switchTab('trends',this)">📊</button>
  <button class="tab-btn" onclick="switchTab('studio',this)">🎬</button>
</div>

<!-- PERIOD BAR -->
<div id="period-bar">
  <button class="period-btn active" onclick="changePeriod(7,this)">7日</button>
  <button class="period-btn" onclick="changePeriod(28,this)">28日</button>
  <button class="period-btn" onclick="changePeriod(90,this)">90日</button>
  <button class="period-btn" onclick="changePeriod(365,this)">1年</button>
</div>

<!-- OVERVIEW TAB -->
<div id="tab-overview" class="tab-content active"></div>

<!-- ANALYTICS TAB -->
<div id="tab-analytics" class="tab-content"></div>

<!-- VIDEOS TAB -->
<div id="tab-videos" class="tab-content" style="padding:0"></div>

<!-- AI TAB -->
<div id="tab-ai" class="tab-content"></div>

<!-- COMMENTS TAB -->
<div id="tab-comments" class="tab-content"></div>

<!-- TRENDS TAB -->
<div id="tab-trends" class="tab-content"></div>

<!-- STUDIO TAB -->
<div id="tab-studio" class="tab-content" style="padding:0;height:calc(100dvh - 120px);display:flex;flex-direction:column"></div>

<!-- VIDEO MODAL -->
<div id="modal">
  <div id="modal-header">
    <button id="modal-back" onclick="closeModal()">←</button>
    <div style="font-size:14px;font-weight:600">動画分析</div>
  </div>
  <img id="modal-banner" src="" alt="">
  <div id="modal-body"></div>
</div>

<script>

const fmt = n => { const x=parseFloat(n||0); if(x>=1e6) return (x/1e6).toFixed(1)+'M'; if(x>=1e4) return Math.round(x/1e3)+'K'; if(x>=1e3) return (x/1e3).toFixed(1)+'K'; return Math.round(x).toLocaleString(); };
const fdate = iso => iso ? iso.slice(0,10).replace(/-/g,'/') : '-';
const fdur = d => { if(!d) return '-'; const m=d.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m) return '-'; const h=+(m[1]||0),mn=+(m[2]||0),s=+(m[3]||0); return h ? `${h}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${mn}:${String(s).padStart(2,'0')}`; };
const fdurSec = s => { s=Math.round(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const fpct = v => `${parseFloat(v||0).toFixed(1)}%`;
const fmoney = v => v==null?'-':`$${parseFloat(v).toFixed(2)}`;
const avgArr = arr => arr.length ? arr.reduce((s,x)=>s+x,0)/arr.length : 0;
const clr = (v,g,y) => parseFloat(v)>=g?'#22d98a':parseFloat(v)>=y?'#f5c842':'#ff4d6d';
const isShort = v => { const dur=v.contentDetails?.duration||''; const m=dur.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m) return false; const h=+(m[1]||0),mn=+(m[2]||0),s=+(m[3]||0); return h===0 && mn===0 && s<=60 || h===0 && mn<=1 && s===0; };
const engRate = v => { const views=+(v.statistics?.viewCount||0); if(!views) return 0; return ((+(v.statistics?.likeCount||0))+(+(v.statistics?.commentCount||0)))/views*100; };

const YTA = 'https://youtubeanalytics.googleapis.com/v2/reports';

async function apiFetch(url, useToken=false) {
  const headers = {};
  if(useToken) headers.Authorization = `Bearer ${await getAccessToken()}`;
  const r = await fetch(url, {headers});
  return r.json();
}

async function fetchChannel(apiKey, inp) {
  inp = inp.trim().replace(/\/$/, '');
  let q;
  if(inp.includes('youtube.com')) { const h=inp.match(/@([^/?&]+)/); if(h) q=`forHandle=@${h[1]}`; else { const c=inp.match(/\/channel\/(UC[^/?&]+)/); if(c) q=`id=${c[1]}`; } }
  else if(inp.startsWith('UC')&&inp.length>20) q=`id=${inp}`;
  else q=`forHandle=${inp.startsWith('@')?inp:'@'+inp}`;
  const d = await apiFetch(`${YT}/channels?part=snippet,statistics&${q}&key=${apiKey}`);
  if(d.error) throw new Error(d.error.message);
  if(!d.items?.length) throw new Error('チャンネルが見つかりません');
  return d.items[0];
}

async function fetchVideos(apiKey, cid, onProg) {
  let all=[],tok=null,pg=0;
  do {
    const url=`${YT}/search?part=snippet&channelId=${cid}&maxResults=50&order=date&type=video&key=${apiKey}`+(tok?`&pageToken=${tok}`:'');
    const sr = await apiFetch(url);
    if(sr.error) throw new Error(sr.error.message);
    const ids = sr.items.map(i=>i.id.videoId).join(',');
    if(ids) { const vr = await apiFetch(`${YT}/videos?part=snippet,statistics,contentDetails&id=${ids}&key=${apiKey}`); all=[...all,...(vr.items||[])]; }
    tok=sr.nextPageToken; pg++;
    onProg?.(all.length);
  } while(tok&&pg<4);
  return all;
}

function dateRange(days) { const end=new Date(),start=new Date(); start.setDate(start.getDate()-days); return {s:start.toISOString().slice(0,10),e:end.toISOString().slice(0,10)}; }

async function fetchAnalytics(cid, days) {
  const {s,e}=dateRange(days);
  const base=`${YTA}?ids=channel==${cid}&startDate=${s}&endDate=${e}`;
  const metrics='views,estimatedMinutesWatched,averageViewDuration,averageViewPercentage,likes,comments,shares,subscribersGained,subscribersLost';
  const d = await apiFetch(`${base}&metrics=${metrics}&dimensions=day&sort=day`, true);
  if(d.error) throw new Error('Analytics: '+d.error.message);
  let rev=null;
  try { const r2 = await apiFetch(`${base}&metrics=estimatedRevenue,estimatedAdRevenue,estimatedRedPartnerRevenue&dimensions=day&sort=day`, true); if(!r2.error) rev=r2; } catch(_){}
  return {daily:d, revenue:rev};
}

async function fetchVideoAnalytics(cid, vid, days) {
  const {s,e}=dateRange(days);
  const base=`${YTA}?ids=channel==${cid}&startDate=${s}&endDate=${e}&filters=video==${vid}`;
  const metrics='views,estimatedMinutesWatched,averageViewDuration,averageViewPercentage,likes,comments,shares,subscribersGained';
  const d = await apiFetch(`${base}&metrics=${metrics}`, true);
  return d.error?null:d;
}

async function fetchComments(apiKey, videoId, maxResults=100) {
  try {
    const url = `${YT}/commentThreads?part=snippet&videoId=${videoId}&maxResults=${maxResults}&order=relevance&key=${apiKey}`;
    const d = await apiFetch(url);
    if(d.error) return [];
    return (d.items||[]).map(i=>i.snippet.topLevelComment.snippet.textDisplay);
  } catch(_) { return []; }
}

function parseRows(data) {
  if(!data?.columnHeaders||!data?.rows) return null;
  const cols=data.columnHeaders.map(h=>h.name);
  const tot={};
  cols.forEach(c=>tot[c]=0);
  (data.rows||[]).forEach(row=>row.forEach((v,i)=>{ if(typeof v==='number') tot[cols[i]]=(tot[cols[i]]||0)+v; }));
  ['averageViewDuration','averageViewPercentage','impressionClickThroughRate'].forEach(c=>{
    if(cols.includes(c)&&data.rows?.length) tot[c]=avgArr(data.rows.map(r=>r[cols.indexOf(c)]));
  });
  return tot;
}

async function callAI(prompt) {
  try {
    const r = await fetch(WORKER, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({model:'claude-haiku-4-5',max_tokens:3000,messages:[{role:'user',content:prompt}]})});
    const d = await r.json();
    const text = d.content?.[0]?.text || '';
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if(jsonMatch) return JSON.parse(jsonMatch[0]);
    return JSON.parse(text.replace(/```json|```/g,'').trim());
  } catch(e) { return {}; }
}

function renderVideosTab(sortKey, filterKey){
  if(sortKey) STATE.sort=sortKey;
  if(filterKey) STATE.filter=filterKey;
  let vids = STATE.vids;
  if(STATE.filter==='long') vids=vids.filter(v=>!isShort(v));
  if(STATE.filter==='short') vids=vids.filter(v=>isShort(v));
  const longCount=STATE.vids.filter(v=>!isShort(v)).length;
  const shortCount=STATE.vids.filter(v=>isShort(v)).length;
  const sorted=[...vids].sort((a,b)=>{
    if(STATE.sort==='views') return +(b.statistics?.viewCount||0)-+(a.statistics?.viewCount||0);
    if(STATE.sort==='likes') return +(b.statistics?.likeCount||0)-+(a.statistics?.likeCount||0);
    if(STATE.sort==='er') return engRate(b)-engRate(a);

  const compareModeActive = STATE.compareMode;

  <div class="sort-bar">

// ── Trends Analysis ──
function renderTrends() {
  const el = document.getElementById('tab-trends');
  if(!el) return;

  const vids = STATE.vids;
  const dailyRows = STATE.analytics?.rows || [];
  const cols = (STATE.analytics?.columnHeaders || []).map(h=>h.name);
  const dayIdx = cols.indexOf('day');
  const viewIdx = cols.indexOf('views');
  const subIdx = cols.indexOf('subscribersGained');

  // Monthly analytics data
  const monthly = {};
  dailyRows.forEach(row => {
    const month = (row[dayIdx]||'').slice(0,7);
    if(!monthly[month]) monthly[month] = {views:0, subs:0};
    monthly[month].views += row[viewIdx]||0;
    monthly[month].subs += row[subIdx]||0;
  });
  const months = Object.keys(monthly).sort();
  const maxViews = Math.max(...months.map(m=>monthly[m].views), 1);
  const maxSubs = Math.max(...months.map(m=>monthly[m].subs), 1);

  // ② Title keyword analysis - word-level


  // ③ Monthly posting quality analysis
  const vidByMonth = {};
  vids.forEach(v => {
    const month = v.snippet.publishedAt.slice(0,7);
    if(!vidByMonth[month]) vidByMonth[month] = [];
    vidByMonth[month].push(+(v.statistics?.viewCount||0));
  });
  const postMonths = Object.keys(vidByMonth).sort().slice(-6);
  const avgViews = avgArr(vids.map(v=>+(v.statistics?.viewCount||0)));
  const threshold = avgViews;
  const postData = postMonths.map(m => {
    const views = vidByMonth[m];
    const total = views.length;
    const quality = views.filter(v=>v>=threshold).length;
    return { month: m.slice(5), total, quality, hitRate: total>0?Math.round(quality/total*100):0 };
  });
  const maxTotal = Math.max(...postData.map(d=>d.total), 1);

  let html = '<div style="padding:4px">';

  // ① Monthly trend
  html += '<div class="section-card fade"><div class="section-title">📈 月別トレンド比較</div>';
  if(months.length >= 2) {
    const viewTrend = monthly[months[months.length-1]].views - monthly[months[months.length-2]].views;
    html += '<div style="display:flex;justify-content:space-between;margin-bottom:8px"><div style="font-size:11px;color:#4a4a60">月別視聴数</div><div style="font-size:12px;color:'+(viewTrend>=0?'#22d98a':'#ff4d6d')+'">'+(viewTrend>=0?'↑':'↓')+' '+fmt(Math.abs(viewTrend))+'</div></div>';
    html += '<div style="display:flex;align-items:flex-end;gap:5px;height:80px;margin-bottom:4px">';
    months.forEach((m,i) => {
      const h = Math.max(5,Math.round((monthly[m].views/maxViews)*74));
      const isLast = i===months.length-1;
      html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div style="font-size:9px;color:'+(isLast?'#7c6dfa':'#4a4a60')+'">'+fmt(monthly[m].views)+'</div><div style="width:100%;height:'+h+'px;background:'+(isLast?'#7c6dfa':i===months.length-2?'#4a3a9a':'#1e1e40')+';border-radius:3px 3px 0 0"></div></div>';
    });
    html += '</div><div style="display:flex;gap:5px;margin-bottom:14px">';
    months.forEach(m => { html += '<div style="flex:1;text-align:center;font-size:9px;color:#4a4a60">'+m.slice(5)+'月</div>'; });
    html += '</div>';

    const subTrend = monthly[months[months.length-1]].subs - monthly[months[months.length-2]].subs;
    html += '<div style="display:flex;justify-content:space-between;margin-bottom:8px"><div style="font-size:11px;color:#4a4a60">月別登録者増加</div><div style="font-size:12px;color:'+(subTrend>=0?'#22d98a':'#ff4d6d')+'">'+(subTrend>=0?'↑':'↓')+' '+Math.abs(subTrend)+'人</div></div>';
    html += '<div style="display:flex;align-items:flex-end;gap:5px;height:60px;margin-bottom:4px">';
    months.forEach((m,i) => {
      const h = Math.max(4,Math.round((monthly[m].subs/maxSubs)*54));
      const isLast = i===months.length-1;
      html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div style="font-size:9px;color:'+(isLast?'#22d98a':'#4a4a60')+'">+'+monthly[m].subs+'</div><div style="width:100%;height:'+h+'px;background:'+(isLast?'#22d98a':'#1a4a30')+';border-radius:3px 3px 0 0"></div></div>';
    });
    html += '</div><div style="display:flex;gap:5px">';
    months.forEach(m => { html += '<div style="flex:1;text-align:center;font-size:9px;color:#4a4a60">'+m.slice(5)+'月</div>'; });
    html += '</div>';
  } else {
    html += '<div style="font-size:12px;color:#4a4a60;padding:12px 0">期間を90日以上に変更すると複数月の比較ができます</div>';
  }
  html += '</div>';

  // ③ Quality hit rate per month
  html += '<div class="section-card fade"><div class="section-title">🎯 月別 投稿数 × バズ本数</div>';
  html += '<div style="font-size:11px;color:#4a4a60;margin-bottom:12px">バズ基準: チャンネル平均視聴数（'+fmt(Math.round(avgViews))+'回）以上</div>';
  html += '<div style="display:flex;gap:8px;margin-bottom:12px">';
  postData.forEach(d => {
    const hitColor = d.hitRate>=50?'#22d98a':d.hitRate>=30?'#f5c842':'#ff4d6d';
    const barH = Math.max(4, Math.round((d.total/maxTotal)*80));
    const qualH = d.total>0?Math.max(0,Math.round((d.quality/d.total)*barH)):0;
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">';
    html += '<div style="font-size:10px;color:'+hitColor+'">'+d.hitRate+'%</div>';
    html += '<div style="width:100%;height:80px;display:flex;flex-direction:column;justify-content:flex-end;background:#0e0e12;border-radius:4px;overflow:hidden">';
    html += '<div style="width:100%;height:'+barH+'px;position:relative;background:#1e1e28">';
    html += '<div style="position:absolute;bottom:0;width:100%;height:'+qualH+'px;background:'+hitColor+';opacity:0.9"></div>';
    html += '</div>';
    html += '</div>';
    html += '<div style="font-size:10px;color:#eeeef5;font-weight:700">'+d.quality+'/'+d.total+'</div>';
    html += '<div style="font-size:9px;color:#4a4a60">'+d.month+'月</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div style="display:flex;gap:12px;font-size:11px;color:#4a4a60"><div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;background:#22d98a;border-radius:2px"></div>バズ本数</div><div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;background:#1e1e28;border-radius:2px"></div>総投稿数</div></div>';
  html += '</div>';

  html += '</div>';
  el.innerHTML = html;
}

let studioInitialized = false;

function studioClearHistory() {
  STATE.studioHistory = [];
  studioInitialized = false;
  try { localStorage.removeItem('ti_studio'); } catch(_){}
  initStudio();
}

function studioKeyDown(e) {
  if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); studioSend(); }
}

function studioOpenFile() {
  const el = document.getElementById('studio-file-input');
  if(el) el.click();
}

function initStudio() {
  const el = document.getElementById('tab-studio');
  if(!el) return;
  if(studioInitialized && el.innerHTML.trim()) return;
  studioInitialized = true;
  STATE.studioImages = [];
  // Load saved history
  if(STATE.studioHistory.length === 0) {
    try {
      const saved = localStorage.getItem('ti_studio');
      if(saved) STATE.studioHistory = JSON.parse(saved);
    } catch(_){}
  }
  renderStudio();
}

function renderStudio() {
  const el = document.getElementById('tab-studio');
  if(!el) return;
  const chName = STATE.ch?.snippet?.title || 'チャンネル';
  el.innerHTML = '<div id="studio-messages"><div class="studio-msg ai" style="max-width:100%"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-size:10px;color:#7c6dfa;font-family:IBM Plex Mono,monospace;letter-spacing:1px">🎬 STUDIO AI</div><button onclick="studioClearHistory()" style="font-size:10px;color:#4a4a60;background:none;border:1px solid #1e1e28;border-radius:4px;padding:2px 6px;cursor:pointer">履歴クリア</button></div><div>'+chName+'のデータを把握しています。投稿前の作品レビュー、タイトル・サムネイル考案など何でもどうぞ。<br><br>画像（サムネ案など）は📎から最大10枚まで一度に添付できます。</div></div></div>'
    + '<div class="studio-input-area">'
    + '<div class="studio-preview" id="studio-preview"></div>'
    + '<div class="studio-row">'
    + '<button class="studio-attach" onclick="studioOpenFile()" title="画像を添付">📎</button>'
    + '<input type="file" id="studio-file-input" accept="image/*" multiple style="display:none" onchange="studioAddImages(this)">'
    + '<textarea class="studio-textarea" id="studio-input" placeholder="質問・依頼を入力... (Shift+Enterで改行)" rows="1" onkeydown="studioKeyDown(event)"></textarea>'
    + '<button class="studio-send" onclick="studioSend()">↑</button>'
    + '</div></div>';

  // Restore history
  if(STATE.studioHistory.length > 0) {
    const msgs = document.getElementById('studio-messages');
    STATE.studioHistory.forEach(m => {
      const div = document.createElement('div');
      div.className = 'studio-msg ' + (m.role==='user'?'user':'ai');
      if(m.role==='ai') {
        const label = document.createElement('div');
        label.style.cssText='font-size:10px;color:#7c6dfa;font-family:IBM Plex Mono,monospace;letter-spacing:1px;margin-bottom:6px';
        label.textContent='🎬 STUDIO AI';
        div.appendChild(label);
      }
      const text = document.createElement('div');
      text.innerHTML = m.text.replace(/\n/g,'<br>');
      div.appendChild(text);
      if(m.images) m.images.forEach(src=>{const img=document.createElement('img');img.src=src;div.appendChild(img);});
      msgs.appendChild(div);
    });
    msgs.scrollTop=999999;
  }
}

function studioAddImages(input) {
  const files = Array.from(input.files);
  const remaining = 10 - STATE.studioImages.length;
  const toAdd = files.slice(0, remaining);
  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      STATE.studioImages.push({data: e.target.result, type: file.type});
      updateStudioPreview();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function updateStudioPreview() {
  const preview = document.getElementById('studio-preview');
  if(!preview) return;
  preview.innerHTML = '';
  STATE.studioImages.forEach((img, i) => {
    const item = document.createElement('div');
    item.className = 'studio-preview-item';
    const imgEl = document.createElement('img');
    imgEl.src = img.data;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.onclick = () => { STATE.studioImages.splice(i,1); updateStudioPreview(); };
    item.appendChild(imgEl);
    item.appendChild(btn);
    preview.appendChild(item);
  });
}

async function studioSend() {
  const input = document.getElementById('studio-input');
  const text = input?.value?.trim();
  if(!text && STATE.studioImages.length===0) return;
  input.value = '';

  const images = [...STATE.studioImages];
  STATE.studioImages = [];
  updateStudioPreview();

  const msgs = document.getElementById('studio-messages');

  // Add user message to UI
  const userDiv = document.createElement('div');
  userDiv.className = 'studio-msg user';
  if(text) { const t=document.createElement('div'); t.textContent=text; userDiv.appendChild(t); }
  images.forEach(img=>{ const i=document.createElement('img'); i.src=img.data; userDiv.appendChild(i); });
  msgs.appendChild(userDiv);

  // Thinking indicator
  const thinkDiv = document.createElement('div');
  thinkDiv.className = 'studio-msg ai';
  thinkDiv.id = 'studio-thinking';
  thinkDiv.innerHTML = '<div style="font-size:10px;color:#7c6dfa;font-family:IBM Plex Mono,monospace;letter-spacing:1px;margin-bottom:6px">🎬 STUDIO AI</div><div style="color:#4a4a60">考え中...</div>';
  msgs.appendChild(thinkDiv);
  msgs.scrollTop=999999;

  // Save to history
  STATE.studioHistory.push({role:'user', text:text||'', images:images.map(i=>i.data)});
  try { localStorage.setItem('ti_studio', JSON.stringify(STATE.studioHistory)); } catch(_){}

  // Build API messages with images
  const chCtx = getChannelContext();
  const systemText = 'あなたはYouTubeチャンネル「'+(STATE.ch?.snippet?.title||'')+'」の専属クリエイティブディレクターです。以下のチャンネルデータを踏まえて、投稿前の作品レビュー、タイトル考案、サムネイル改善など具体的なアドバイスをしてください。\n\n'+chCtx;

  const apiMessages = [
    {role:'user', content:[{type:'text', text:systemText}]},
    {role:'assistant', content:[{type:'text', text:'了解しました。何でも相談してください。'}]}
  ];

  STATE.studioHistory.slice(0,-1).forEach(m => {
    const content = [];
    if(m.text) content.push({type:'text', text:m.text});
    if(m.images) m.images.forEach(src=>{
      const matches = src.match(/^data:([^;]+);base64,(.+)$/);
      if(matches) content.push({type:'image', source:{type:'base64', media_type:matches[1], data:matches[2]}});
    });
    if(content.length>0) apiMessages.push({role:m.role==='user'?'user':'assistant', content});
  });

  // Current message
  const currentContent = [];
  if(text) currentContent.push({type:'text', text:text});
  images.forEach(img=>{
    const matches = img.data.match(/^data:([^;]+);base64,(.+)$/);
    if(matches) currentContent.push({type:'image', source:{type:'base64', media_type:matches[1], data:matches[2]}});
  });
  if(currentContent.length>0) apiMessages.push({role:'user', content:currentContent});

  try {
    const r = await fetch(WORKER, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6', max_tokens:2000, messages:apiMessages})
    });
    const d = await r.json();
    const reply = d.content?.[0]?.text || 'エラーが発生しました。';
    STATE.studioHistory.push({role:'ai', text:reply});
    try { localStorage.setItem('ti_studio', JSON.stringify(STATE.studioHistory)); } catch(_){}
    thinkDiv.remove();
    const aiDiv = document.createElement('div');
    aiDiv.className = 'studio-msg ai';
    const label = document.createElement('div');
    label.style.cssText='font-size:10px;color:#7c6dfa;font-family:IBM Plex Mono,monospace;letter-spacing:1px;margin-bottom:6px';
    label.textContent='🎬 STUDIO AI';
    const body = document.createElement('div');
    body.innerHTML = reply.replace(/\n/g,'<br>');
    aiDiv.appendChild(label);
    aiDiv.appendChild(body);
    msgs.appendChild(aiDiv);
    msgs.scrollTop=999999;
  } catch(e) {
    thinkDiv.remove();
    STATE.studioHistory.pop();
    const errDiv = document.createElement('div');
    errDiv.className = 'studio-msg ai';
    errDiv.innerHTML = '<div style="color:#ff4d6d">エラーが発生しました。もう一度お試しください。</div>';
    msgs.appendChild(errDiv);
  }
}

async function doCommentAnalysis(){
  document.getElementById('tab-comments').innerHTML='<div style="text-align:center;padding-top:100px"><div class="spin" style="font-size:40px">⚙</div><div id="comment-load-msg" style="margin-top:24px;color:#4a4a60;font-size:13px">コメントを収集中...</div></div>';
  const topVids=[...STATE.vids].sort((a,b)=>+(b.statistics?.viewCount||0)-+(a.statistics?.viewCount||0)).slice(0,10);
  const allComments=[];
  for(let i=0;i<topVids.length;i++){
    const v=topVids[i];
    const msgEl=document.getElementById('comment-load-msg');
    if(msgEl) msgEl.textContent=v.snippet.title.slice(0,20)+'... のコメントを取得中 ('+(i+1)+'/10)';
    const comments=await fetchComments(STATE.apiKey,v.id,20);
    comments.forEach(c=>allComments.push({title:v.snippet.title,comment:c}));
  }
  const msgEl=document.getElementById('comment-load-msg');
  if(msgEl) msgEl.textContent='AIがコメントを分析中...';
  const commentText=allComments.map(c=>'['+c.title.slice(0,20)+'] '+c.comment).join('\n').slice(0,4000);
  const prompt='あなたはYouTubeコメント分析の専門家です。以下のコメントデータを分析し、JSONのみで回答（前置き・コードブロック不要）。\n\nチャンネル: '+(STATE.ch?.snippet?.title||'')+'\nコメント数: '+allComments.length+'件（トップ10動画から収集）\n\n【コメント一覧（動画タイトル|コメント）】\n'+commentText+'\n\nJSON:{"summary":"コメント全体の傾向3文","positives":["視聴者が喜んでいること1","2","3","4","5"],"negatives":["視聴者が不満/リクエストしていること1","2","3"],"requests":["視聴者からの要望1","2","3","4"],"emotions":["主要な感情的反応1","2","3"],"topicInsights":["コメントから読み取れるコンテンツインサイト1","2","3"],"audienceType":"視聴者層の特徴","recommendations":["コメントに基づく改善提案1","2","3"]}';
  const res=await callAI(prompt);
  STATE.commentsLoaded=true;
  if(!res||Object.keys(res).length===0){
    document.getElementById('tab-comments').innerHTML='<div style="padding:20px;color:#ff4d6d;font-size:13px">分析に失敗しました。<br><button onclick="renderCommentsStart()" style="margin-top:16px;padding:10px 20px;background:#7c6dfa;color:#fff;border:none;border-radius:8px;cursor:pointer">戻る</button></div>';
    return;
  }
  let html='<div class="fade" style="padding:4px">';
  html+='<div style="background:#0e0e12;border:1px solid #1e1e28;border-radius:12px;padding:16px;margin-bottom:12px"><div style="font-size:10px;color:#7c6dfa;font-family:IBM Plex Mono,monospace;letter-spacing:2px;margin-bottom:8px">💬 COMMENT ANALYSIS · '+allComments.length+'件</div><div style="font-size:13px;color:#aaa;line-height:1.8">'+(res.summary||'')+'</div><div style="margin-top:10px;font-size:11px;color:#4a4a60">視聴者層: '+(res.audienceType||'')+'</div></div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px"><div style="background:#0e0e12;border:1px solid rgba(34,217,138,0.25);border-radius:10px;padding:14px"><div style="font-size:11px;font-weight:700;color:#22d98a;margin-bottom:10px">👍 響いていること</div>'+(res.positives||[]).map(p=>'<div style="font-size:12px;color:#888;margin-bottom:7px;line-height:1.5">• '+p+'</div>').join('')+'</div><div style="background:#0e0e12;border:1px solid rgba(255,77,109,0.25);border-radius:10px;padding:14px"><div style="font-size:11px;font-weight:700;color:#ff4d6d;margin-bottom:10px">😤 不満・ネック</div>'+(res.negatives||[]).map(n=>'<div style="font-size:12px;color:#888;margin-bottom:7px;line-height:1.5">• '+n+'</div>').join('')+'</div></div>';
  html+='<div style="background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:16px;margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:#f5c842;margin-bottom:10px">🙏 視聴者からのリクエスト</div>'+(res.requests||[]).map((r,i)=>'<div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-start"><div style="background:#f5c84222;color:#f5c842;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;font-family:IBM Plex Mono,monospace">'+(i+1)+'</div><div style="font-size:13px;color:#bbb;line-height:1.6">'+r+'</div></div>').join('')+'</div>';
  html+='<div style="background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:16px;margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:#7c6dfa;margin-bottom:10px">🧠 コンテンツインサイト</div>'+(res.topicInsights||[]).map(t=>'<div style="font-size:13px;color:#aaa;margin-bottom:8px;line-height:1.6">• '+t+'</div>').join('')+'</div>';
  html+='<div style="background:#0e0e12;border:1px solid #1e1e28;border-radius:10px;padding:16px;margin-bottom:10px"><div style="font-size:12px;font-weight:700;margin-bottom:10px">😊 感情的反応</div><div style="display:flex;flex-wrap:wrap;gap:8px">'+(res.emotions||[]).map(e=>'<span style="background:#1e1e28;color:#aaa;border-radius:20px;padding:5px 12px;font-size:12px">'+e+'</span>').join('')+'</div></div>';
  html+='<div style="background:#0e0e12;border:1px solid rgba(124,109,250,0.3);border-radius:10px;padding:16px;margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:#7c6dfa;margin-bottom:12px">✅ コメントに基づく改善提案</div>'+(res.recommendations||[]).map((r,i)=>'<div style="display:flex;gap:12px;margin-bottom:10px;align-items:flex-start"><div style="background:linear-gradient(135deg,#7c6dfa,#5bb8ff);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-family:IBM Plex Mono,monospace">'+(i+1)+'</div><div style="font-size:13px;color:#bbb;line-height:1.7">'+r+'</div></div>').join('')+'</div>';
  html+='<button onclick="renderCommentsStart();STATE.commentsLoaded=false;" style="width:100%;padding:12px;background:none;border:1px solid #1e1e28;color:#4a4a60;border-radius:10px;font-size:12px;cursor:pointer">再分析する</button>';
  html+='</div>';
  document.getElementById('tab-comments').innerHTML=html;
}

// ── Channel Context ──
function getChannelContext() {
  const t=parseRows(STATE.analytics)||{};
  const longVids=STATE.vids.filter(v=>!isShort(v));
  const shortVids=STATE.vids.filter(v=>isShort(v));
  const topVids=[...STATE.vids].sort((a,b)=>+(b.statistics?.viewCount||0)-+(a.statistics?.viewCount||0)).slice(0,10);
  const vidList=topVids.map((v,i)=>(i+1)+'. '+v.snippet.title+' (視聴:'+fmt(v.statistics?.viewCount)+' ER:'+engRate(v).toFixed(1)+'% '+fdate(v.snippet.publishedAt)+')').join('\n');
  return 'チャンネル名: '+(STATE.ch?.snippet?.title||'')+'\n登録者数: '+fmt(STATE.ch?.statistics?.subscriberCount)+'人\n総視聴数: '+fmt(STATE.ch?.statistics?.viewCount)+'\n長尺: '+longVids.length+'本 / ショート: '+shortVids.length+'本\n直近'+STATE.period+'日: 視聴'+fmt(Math.round(t.views||0))+' 維持率'+fpct(t.averageViewPercentage)+' 平均視聴時間'+fdurSec(t.averageViewDuration)+'\nいいね'+fmt(Math.round(t.likes||0))+' コメント'+fmt(Math.round(t.comments||0))+' 新規登録+'+fmt(Math.round(t.subscribersGained||0))+' 解除-'+fmt(Math.round(t.subscribersLost||0))+'\nトップ動画:\n'+vidList;
}

// ── Inline Chat ──
const CHAT_CTX = {};

function renderInlineChat(containerId, historyKey, systemPrompt) {
  const el=document.getElementById(containerId);
  if(!el) return;
  CHAT_CTX[containerId]={historyKey, systemPrompt};
  const history=STATE[historyKey]||[];
  const wrapper=document.createElement('div');
  wrapper.className='inline-chat';
  const title=document.createElement('div');
  title.className='inline-chat-title';
  title.textContent='🤖 AIに質問する';
  const msgs=document.createElement('div');
  msgs.className='inline-chat-messages';
  msgs.id=containerId+'-msgs';
  if(history.length===0){
    const hint=document.createElement('div');
    hint.style.cssText='font-size:12px;color:#4a4a60';
    hint.textContent='分析結果について何でも聞いてください';
    msgs.appendChild(hint);
  } else {
    history.forEach(m=>{
      const d=document.createElement('div');
      d.className='ichat-msg '+(m.role==='user'?'user':'ai');
      d.innerHTML=m.content.replace(/\n/g,'<br>');
      msgs.appendChild(d);
    });
  }
  const row=document.createElement('div');
  row.className='ichat-input-row';
  const input=document.createElement('textarea');
  input.className='ichat-input';
  input.id=containerId+'-input';
  input.placeholder='質問を入力...';
  input.rows=2;
  input.style.cssText='resize:none;height:auto;min-height:44px;';
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();inlineChatSend(containerId);}});
  const btn=document.createElement('button');
  btn.className='ichat-send';
  btn.textContent='↑';
  btn.addEventListener('click',function(){inlineChatSend(containerId);});
  row.appendChild(input);
  row.appendChild(btn);
  wrapper.appendChild(title);
  wrapper.appendChild(msgs);
  wrapper.appendChild(row);
  el.innerHTML='';
  el.appendChild(wrapper);
  msgs.scrollTop=999999;
}

async function inlineChatSend(containerId) {
  const ctx=CHAT_CTX[containerId];
  if(!ctx) return;
  const input=document.getElementById(containerId+'-input');
  const text=input?.value?.trim();
  if(!text) return;
  input.value='';
  const {historyKey, systemPrompt}=ctx;
  if(!STATE[historyKey]) STATE[historyKey]=[];
  STATE[historyKey].push({role:'user',content:text});
  const msgs=document.getElementById(containerId+'-msgs');
  if(msgs){
    const uDiv=document.createElement('div');uDiv.className='ichat-msg user';uDiv.textContent=text;
    const tDiv=document.createElement('div');tDiv.className='ichat-msg thinking';tDiv.id=containerId+'-thinking';tDiv.textContent='考え中...';
    msgs.appendChild(uDiv);msgs.appendChild(tDiv);
    msgs.scrollTop=999999;
  }
  const apiMessages=[{role:'user',content:systemPrompt},{role:'assistant',content:'了解しました。何でも聞いてください。'},...STATE[historyKey].map(m=>({role:m.role,content:m.content}))];
  try {
    const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5',max_tokens:2000,messages:apiMessages})});
    const d=await r.json();
    const reply=d.content?.[0]?.text||'エラーが発生しました。';
    STATE[historyKey].push({role:'assistant',content:reply});
    document.getElementById(containerId+'-thinking')?.remove();
    if(msgs){
      const aDiv=document.createElement('div');aDiv.className='ichat-msg ai';aDiv.innerHTML=reply.replace(/\n/g,'<br>');
      msgs.appendChild(aDiv);msgs.scrollTop=999999;
    }
  } catch(_) {
    document.getElementById(containerId+'-thinking')?.remove();
    STATE[historyKey].pop();
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('setup')?.classList.contains('active')) startLoad();});
</script>
